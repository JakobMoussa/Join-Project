<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Join</title>
  <link rel="icon" type="image/x-icon" href="./assets/icons/flavicon.png" />
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/welcome.css">
  <script src="./scripts/welcome.js"></script>
</head>

<body class="welcome-body">
  <!-- Splash Logo Overlay with animation -->
  <div class="logo-overlay">
    <img src="./assets/icons/join-logo.svg" class="logo" alt="Join Logo">
  </div>

  <div class="welcome-content">
    <main class="welcome-card">
      <h1 class="welcome-title">Welcome</h1>
      <div class="welcome-underline"></div>
      <p class="welcome-description">
        Pick the option that suits your role: create a request as a stakeholder or log in if you’re part of the team.
      </p>

      <div class="role-options">
        <!-- Stakeholder Option -->
        <div class="role-block">
          <div class="role-header">
            <span class="role-icon">
              <svg width="22" height="20" viewBox="0 0 24 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="6" width="20" height="14" rx="2.5" stroke="#29ABE2" stroke-width="2"/>
                <path d="M16 6V4C16 2.89543 15.1046 2 14 2H10C8.89543 2 8 2.89543 8 4V6" stroke="#29ABE2" stroke-width="2"/>
              </svg>
            </span>
            <span>Are you a stakeholder?</span>
          </div>
          <a href="#" class="btn-request" onclick="event.preventDefault()">Create request</a>
        </div>

        <!-- Team Member Option -->
        <div class="role-block">
          <div class="role-header">
            <span class="role-icon">
              <svg width="24" height="20" viewBox="0 0 24 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 19V17.5C16 15.567 14.433 14 12.5 14H6.5C4.567 14 3 15.567 3 17.5V19" stroke="#29ABE2" stroke-width="2" stroke-linecap="round"/>
                <circle cx="9.5" cy="6.5" r="3.5" stroke="#29ABE2" stroke-width="2"/>
                <path d="M21 19V17.5C20.997 15.82 19.82 14.36 18.2 14.05" stroke="#29ABE2" stroke-width="2" stroke-linecap="round"/>
                <path d="M15 3.1C16.2 3.6 17 4.8 17 6.2C17 7.6 16.2 8.8 15 9.3" stroke="#29ABE2" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <span>Are you a team member?</span>
          </div>
          <a href="#" class="btn-member" onclick="event.preventDefault()">Member log in</a>
        </div>
      </div>
    </main>

    <footer class="welcome-footer">
      <a href="./html-templates/privacy-policy.html?msg=privacy">Privacy Policy</a>
      <a href="./html-templates/legal-notice.html?msg=privacy">Legal notice</a>
    </footer>
  </div>
</body>

</html>
